<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>ForeverStrong · KeyboxLoader</title><script src="../theme.js"></script>



<link href="../halloween.css" rel="stylesheet"/><link href="../components.css" rel="stylesheet"/><script src="../integration.js"></script><script src="../component-bridge.js"></script><link href="../forever.css" rel="stylesheet"/></head>
<body class="component"><header class="he-component-header"><div><p>FOREVER STRONG / CONTROL CENTER</p><h1>Keybox scanner</h1></div></header>
<div class="container">
<div class="hero">
<div class="key-icon">
<span class="material-icons-round">vpn_key</span>
</div>
<div class="hero-text">
<h1 class="fs-original-title">Keybox Loader</h1>
<p>XML keyboxes found in your Download folder</p>
</div>
</div>
<div class="files-panel">
<div class="files-header">
<div class="files-heading">
<span class="files-title">Available Keyboxes</span>
<span class="files-subtitle" id="fileCount">Scanning...</span>
</div>
<button aria-label="Refresh" class="refresh" id="refreshBtn">
<span class="material-icons-round">refresh</span>
</button>
</div>
<div class="file-list" id="fileList">
<div class="scanning">
<div class="spinner"></div>
<span>Scanning Download...</span>
</div>
</div>
</div>
</div>
<div class="overlay" id="confirmOverlay">
<div class="confirm-card">
<div class="drag-handle"></div>
<div class="confirm-header">
<div class="confirm-icon">
<span class="material-icons-round">vpn_key</span>
</div>
<div class="confirm-info">
<div class="confirm-title">Set Keybox</div>
<div class="confirm-file" id="selectedFileName"></div>
</div>
</div>
<div class="destination-title">
      Choose destination
    </div>
<div class="destination-list">
<button class="destination" data-destination="omk" type="button">
<div class="destination-icon">
<span class="material-icons-round">key</span>
</div>
<div class="destination-info">
<div class="destination-name">OH MY KEYMINT</div>
<div class="destination-path">/data/misc/keystore/omk/keybox.xml</div>
</div>
<span class="material-icons-round destination-arrow">chevron_right</span>
</button>
<button class="destination" data-destination="tricky" type="button">
<div class="destination-icon">
<span class="material-icons-round">security</span>
</div>
<div class="destination-info">
<div class="destination-name">BUNDLED TRICKY STORE OSS</div>
<div class="destination-path">/data/adb/tricky_store/keybox.xml</div>
</div>
<span class="material-icons-round destination-arrow">chevron_right</span>
</button>
<button class="destination" data-destination="teesim" type="button">
<div class="destination-icon">
<span class="material-icons-round">memory</span>
</div>
<div class="destination-info">
<div class="destination-name">TEE SIMULATOR</div>
<div class="destination-path">/data/adb/teesim/keybox.xml</div>
</div>
<span class="material-icons-round destination-arrow">chevron_right</span>
</button>
</div>
<button class="cancel-button" id="cancelButton" type="button">
      Cancel
    </button>
</div>
</div>
<div class="overlay" id="previewOverlay"><div class="confirm-card preview-card"><div class="drag-handle"></div><div class="confirm-header"><div class="confirm-icon"><span class="material-icons-round">code</span></div><div class="confirm-info"><div class="confirm-title">Keybox Preview</div><div class="confirm-file" id="previewFileName"></div></div></div><pre class="xml-preview" id="previewContent">Loading XML…</pre><button class="cancel-button" id="closePreview" type="button">Close preview</button></div></div>
<div class="toast" id="toast">
<span class="material-icons-round" id="toastIcon">check_circle</span>
<span id="toastText">Success</span>
</div>
<script>
const DOWNLOAD_DIR = "/sdcard/Download";
const BACKUP_DIR = "/data/adb/Box-Brain/KeyBackup";

const DESTINATIONS = {
  omk: {
    name: "OH MY KEYMINT",
    path: "/data/misc/keystore/omk/keybox.xml"
  },

  tricky: {
    name: "BUNDLED TRICKY STORE OSS",
    path: heIntegration.config+"/keybox.xml"
  },

  teesim: {
    name: "TEE SIMULATOR",
    path: "/data/adb/teesim/keybox.xml"
  }
};

let allFiles = [];
let selectedFile = null;
let isScanning = false;
let isSetting = false;
let toastTimer = null;

function runShell(cmd){return window.heShell(cmd);}

function shellQuote(value) {
  return "'" + String(value).replace(/'/g, "'\\''") + "'";
}

function showToast(message, type) {
  const toast = document.getElementById("toast");
  const icon = document.getElementById("toastIcon");
  const text = document.getElementById("toastText");

  clearTimeout(toastTimer);

  icon.textContent =
    type === "success"
      ? "check_circle"
      : "error";

  text.textContent = message;

  toast.className = "toast show " + type;

  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2800);
}

function formatSize(bytes) {
  const size = Number(bytes) || 0;

  if (size < 1024) {
    return size + " B";
  }

  if (size < 1024 * 1024) {
    return (size / 1024).toFixed(1) + " KB";
  }

  return (size / (1024 * 1024)).toFixed(1) + " MB";
}

function formatDate(timestamp) {
  const value = Number(timestamp);

  if (!value) {
    return "Unknown date";
  }

  return new Date(value * 1000).toLocaleString();
}

function relativePath(path) {
  if (path.indexOf(DOWNLOAD_DIR + "/") === 0) {
    return path.substring((DOWNLOAD_DIR + "/").length);
  }

  return path;
}

async function scan() {
  if (isScanning) {
    return;
  }

  isScanning = true;

  const refresh = document.getElementById("refreshBtn");
  const list = document.getElementById("fileList");
  const count = document.getElementById("fileCount");

  refresh.classList.add("spinning");
  count.textContent = "Scanning...";

  list.innerHTML = `
    <div class="scanning">
      <div class="spinner"></div>
      <span>Scanning Download...</span>
    </div>
  `;

  try {

    const command =
      "find " +
      shellQuote(DOWNLOAD_DIR) +
      " -type f -iname '*.xml' -printf '%T@|%s|%p\\n' 2>/dev/null | sort -nr";

    const output = await runShell(command);

    parseFiles(output);

  } catch (error) {

    console.error("Scan failed:", error);

    allFiles = [];

    count.textContent = "Scan failed";

    list.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          <span class="material-icons-round">error_outline</span>
        </div>

        <div class="empty-title">Unable to scan Download</div>

        <div class="empty-text">
          Shell access is unavailable.
        </div>

      </div>
    `;

  } finally {

    refresh.classList.remove("spinning");
    isScanning = false;
  }
}

function parseFiles(output) {
  if (!output || !output.trim()) {
    allFiles = [];
    document.getElementById("fileCount").textContent = "No XML files found";
    renderEmpty();
    return;
  }

  allFiles = output
    .trim()
    .split("\n")
    .filter(Boolean)
    .map(line => {

      const firstSeparator = line.indexOf("|");
      const secondSeparator = line.indexOf("|", firstSeparator + 1);

      if (firstSeparator === -1 || secondSeparator === -1) {
        return null;
      }

      const timestamp = parseFloat(
        line.substring(0, firstSeparator)
      ) || 0;

      const size = parseInt(
        line.substring(firstSeparator + 1, secondSeparator),
        10
      ) || 0;

      const path = line.substring(secondSeparator + 1);

      return {
        timestamp,
        size,
        path,
        name: path.split("/").pop()
      };

    })
    .filter(file => file && file.path && /\.xml$/i.test(file.name));

  document.getElementById("fileCount").textContent =
    allFiles.length === 1
      ? "1 XML file found"
      : allFiles.length + " XML files found";

  render();
}

function render() {
  const list = document.getElementById("fileList");

  if (!allFiles.length) {
    renderEmpty();
    return;
  }

  list.innerHTML = allFiles.map((file, index) => {

    return `
      <div class="file-item" style="flex-wrap:wrap">

        <div class="file-icon">
          <span class="material-icons-round">description</span>
        </div>

        <div class="file-info">

          <div class="file-name">
            ${escapeHtml(file.name)}
          </div>

          <div class="file-path">
            ${escapeHtml(relativePath(file.path))}
          </div>

          <div class="file-meta">
            ${formatSize(file.size)}
          </div>

        </div>

        <div class="file-actions">
          <button class="preview-button" data-preview-index="${index}" type="button">Preview</button>
          <button class="set-button" data-index="${index}" type="button">Set</button>
        </div>
        <div class="keybox-details" id="keybox-details-${index}"><span class="details-empty">Reading keybox details…</span></div>

      </div>
    `;

  }).join("");

  allFiles.forEach((file, index) => loadKeyboxDetails(file, index));

  list.querySelectorAll(".preview-button").forEach(button => {
    button.addEventListener("click", event => {
      event.stopPropagation();
      const index = Number(button.dataset.previewIndex);
      if (Number.isInteger(index) && allFiles[index]) previewFile(allFiles[index]);
    });
  });

  list.querySelectorAll(".set-button").forEach(button => {

    button.addEventListener("click", event => {

      event.stopPropagation();

      const index = Number(button.dataset.index);

      if (!Number.isInteger(index) || !allFiles[index]) {
        return;
      }

      openConfirmation(allFiles[index]);
    });

  });
}

function extractKeyboxDetails(xml) {
  const source = String(xml || "");
  const results = [];
  const add = (label, value) => { if (value !== null && String(value).trim()) results.push({label, value: String(value).trim()}); };
  const deviceRe = /<\s*(?:[\w.-]+:)?Keybox\b([^>]*)>/gi;
  let m;
  while ((m = deviceRe.exec(source))) {
    const attr = m[1].match(/\bDeviceID\s*=\s*(["'])(.*?)\1/i);
    if (attr) add("DeviceID", attr[2]);
  }
  const numberRe = /<\s*(?:[\w.-]+:)?NumberOfCertificates\b[^>]*>\s*([\s\S]*?)\s*<\s*\/\s*(?:[\w.-]+:)?NumberOfCertificates\s*>/gi;
  while ((m = numberRe.exec(source))) add("NumberOfCertificates", m[1].replace(/<[^>]*>/g, "").trim());
  const certRe = /<\s*(?:[\w.-]+:)?Certificate\b([^>]*)>/gi;
  while ((m = certRe.exec(source))) {
    const attr = m[1].match(/\bformat\s*=\s*(["'])(.*?)\1/i);
    if (attr) add("Certificate format", attr[2]);
  }
  const keyRe = /<\s*(?:[\w.-]+:)?Key\b([^>]*)>/gi;
  while ((m = keyRe.exec(source))) {
    const attr = m[1].match(/\balgorithm\s*=\s*(["'])(.*?)\1/i);
    if (attr) add("Key algorithm", attr[2]);
  }
  const seen = new Set();
  return results.filter(item => {
    const key = item.label + "\u0000" + item.value;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

async function loadKeyboxDetails(file, index) {
  const target = document.getElementById("keybox-details-" + index);
  if (!target) return;
  try {
    const xml = await runShell("cat -- " + shellQuote(file.path));
    const details = extractKeyboxDetails(xml);
    if (!details.length) {
      target.innerHTML = '<span class="details-empty">No matching keybox metadata found</span>';
      return;
    }
    target.innerHTML = details.map(item => '<span class="detail-row"><span class="detail-label">' + escapeHtml(item.label) + ': </span><span class="detail-value">' + escapeHtml(item.value) + '</span></span>').join("");
  } catch (e) {
    target.innerHTML = '<span class="details-empty">Unable to read keybox details</span>';
  }
}

function renderEmpty() {
  document.getElementById("fileList").innerHTML = `
    <div class="empty">

      <div class="empty-icon">
        <span class="material-icons-round">folder_open</span>
      </div>

      <div class="empty-title">
        No XML files found
      </div>

      <div class="empty-text">
        Place a keybox XML anywhere inside<br>
        ${DOWNLOAD_DIR}
      </div>

    </div>
  `;
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function previewFile(file) {
  const overlay = document.getElementById("previewOverlay");
  const content = document.getElementById("previewContent");
  document.getElementById("previewFileName").textContent = file.path;
  content.textContent = "Loading XML…";
  overlay.classList.add("show");
  try {
    const output = await runShell("cat -- " + shellQuote(file.path));
    content.textContent = String(output == null ? "" : output) || "(Empty file)";
  } catch (error) {
    content.textContent = "Unable to read this file.";
  }
}

function closePreview() {
  document.getElementById("previewOverlay").classList.remove("show");
}

function openConfirmation(file) {
  selectedFile = file;

  document.getElementById("selectedFileName").textContent =
    file.name;

  document.getElementById("confirmOverlay").classList.add("show");
}

function closeConfirmation() {
  if (isSetting) {
    return;
  }

  document.getElementById("confirmOverlay").classList.remove("show");

  setTimeout(() => {
    selectedFile = null;
  }, 220);
}

async function setKeybox(destinationKey) {
  if(destinationKey!=="tricky"){
    const state=heIntegration.parse(await heIntegration.call('status'));
    if(state[destinationKey==='omk'?'external_omk':'external_teesim']!=='1'){showToast('External engine is not enabled. Use bundled Tricky Store OSS.','error');return;}
  }

  if (!selectedFile || isSetting) {
    return;
  }

  const destination = DESTINATIONS[destinationKey];

  if (!destination) {
    return;
  }

  isSetting = true;

  const buttons = document.querySelectorAll(".destination");

  buttons.forEach(button => {
    button.disabled = true;
  });

  const source = selectedFile.path;
  const target = destination.path;

  try {

    const sourceQuoted = shellQuote(source);
    const targetQuoted = shellQuote(target);
    const backupDirQuoted = shellQuote(BACKUP_DIR);

    const command = `
      set -e

      src=${sourceQuoted}
      target=${targetQuoted}
      backup=${backupDirQuoted}

      [ -f "$src" ]

      mkdir -p "$backup"

      if [ -f "$target" ]; then
        timestamp=$(date '+%Y%m%d-%H%M%S')
        backup_file="$backup/key-loader-$timestamp.XML"
        counter=1

        while [ -e "$backup_file" ]; do
          backup_file="$backup/key-loader-$timestamp-$counter.XML"
          counter=$((counter + 1))
        done

        cp -f "$target" "$backup_file"
        chmod 644 "$backup_file"
      fi

      mkdir -p "$(dirname "$target")"

      cp -f "$src" "$target"
      chmod 644 "$target"
    `;

    await runShell(
      "sh -c " + shellQuote(command)
    );

    closeConfirmation();

    showToast(
      "Keybox set to " + destination.name,
      "success"
    );

  } catch (error) {

    console.error("Set keybox failed:", error);

    showToast(
      "Failed to set keybox",
      "error"
    );

  } finally {

    isSetting = false;

    buttons.forEach(button => {
      button.disabled = false;
    });

  }
}

document.getElementById("closePreview").addEventListener("click", closePreview);
document.getElementById("previewOverlay").addEventListener("click", event => {
  if (event.target.id === "previewOverlay") closePreview();
});

document.getElementById("refreshBtn").addEventListener(
  "click",
  scan
);

document.getElementById("cancelButton").addEventListener(
  "click",
  closeConfirmation
);

document.getElementById("confirmOverlay").addEventListener(
  "click",
  event => {

    if (event.target.id === "confirmOverlay") {
      closeConfirmation();
    }

  }
);

document.querySelectorAll(".destination").forEach(button => {

  button.addEventListener("click", () => {

    const destination = button.dataset.destination;

    setKeybox(destination);
  });

});

document.addEventListener("keydown", event => {

  if (event.key === "Escape") {
    closeConfirmation();
    closePreview();
  }

});

scan();
</script>


<script src="../TRANSLATIONS/i18n.js"></script>
