<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Keybox Loader</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #1f2233;
  --surface: #232637d9;
  --surface-2: #232637e6;
  --surface-hover: #2b3047;
  --border: #ffffff12;
  --border-strong: #ffffff1c;
  --text: #e6e6e6;
  --text-secondary: #9aa3ff;
  --text-muted: #737b90;
  --accent: #4da3ff;
  --accent-soft: #4da3ff16;
  --accent-border: #4da3ff42;
  --success: #45d98a;
  --danger: #ff5d73;
  --overlay: #000000aa;
  --radius: 20px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  padding: 18px 15px 32px;
  overflow-x: hidden;
}

button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
}

.container {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
}

.hero {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 19px;
  margin-bottom: 18px;
  border-radius: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: 0 12px 35px #00000020;
}

.hero::after {
  content: "";
  position: absolute;
  width: 130px;
  height: 130px;
  right: -55px;
  top: -55px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.06;
  pointer-events: none;
}

.key-icon {
  width: 56px;
  height: 56px;
  flex: 0 0 56px;
  border-radius: 18px;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 25px #1592ff35;
}

.key-icon span {
  color: #fff;
  font-size: 29px;
}

.hero-text {
  min-width: 0;
  position: relative;
  z-index: 1;
}

.hero h1 {
  font-size: 1.28rem;
  line-height: 1.2;
  font-weight: 800;
  letter-spacing: -0.025em;
  margin-bottom: 5px;
}

.hero p {
  color: var(--text-muted);
  font-size: 0.79rem;
  font-weight: 500;
  line-height: 1.45;
}

.files-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 14px;
  box-shadow: 0 12px 35px #00000018;
}

.files-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 3px 3px 13px;
}

.files-heading {
  min-width: 0;
}

.files-title {
  display: block;
  color: var(--text);
  font-size: 0.86rem;
  font-weight: 700;
  margin-bottom: 3px;
}

.files-subtitle {
  display: block;
  color: var(--text-muted);
  font-size: 0.7rem;
  font-weight: 500;
}

.refresh {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--surface-2);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.2s ease;
}

.refresh:active {
  transform: scale(0.9);
}

.refresh:hover {
  color: var(--accent);
  border-color: var(--accent-border);
}

.refresh.spinning span {
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.file-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.file-item {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 11px;
  min-height: 74px;
  transition: 0.18s ease;
}

.file-item:active {
  background: var(--surface-hover);
  transform: scale(0.99);
}

.file-icon {
  width: 44px;
  height: 44px;
  flex: 0 0 44px;
  border-radius: 14px;
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
}

.file-icon span {
  font-size: 23px;
}

.file-info {
  flex: 1;
  min-width: 0;
}

.file-name {
  color: var(--text);
  font-size: 0.86rem;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}

.file-path {
  color: var(--text-muted);
  font-size: 0.67rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 3px;
}

.file-meta {
  color: var(--text-muted);
  font-size: 0.64rem;
  font-weight: 500;
}

.set-button {
  height: 39px;
  min-width: 66px;
  padding: 0 14px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: #fff;
  font-size: 0.76rem;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
  box-shadow: 0 5px 15px #1592ff25;
  transition: 0.18s ease;
}

.set-button:active {
  transform: scale(0.92);
}

.set-button:disabled {
  opacity: 0.55;
  pointer-events: none;
}

.empty {
  text-align: center;
  padding: 58px 20px 55px;
  color: var(--text-muted);
}

.empty-icon {
  width: 70px;
  height: 70px;
  margin: 0 auto 16px;
  border-radius: 22px;
  background: var(--surface-hover);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
}

.empty-icon span {
  font-size: 35px;
  opacity: 0.5;
}

.empty-title {
  color: var(--text-secondary);
  font-size: 0.88rem;
  font-weight: 650;
  margin-bottom: 6px;
}

.empty-text {
  font-size: 0.73rem;
  line-height: 1.55;
}

.scanning {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 50px 20px;
  color: var(--text-muted);
  font-size: 0.78rem;
  font-weight: 500;
}

.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid var(--border-strong);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--overlay);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 12px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.22s ease, visibility 0.22s ease;
}

.overlay.show {
  opacity: 1;
  visibility: visible;
}

.confirm-card {
  width: 100%;
  max-width: 480px;
  background: #232637e6;
  border: 1px solid var(--border-strong);
  border-radius: 27px;
  padding: 20px;
  box-shadow: 0 -5px 50px #00000050;
  transform: translateY(30px);
  transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.overlay.show .confirm-card {
  transform: translateY(0);
}

.drag-handle {
  width: 38px;
  height: 4px;
  margin: -7px auto 19px;
  border-radius: 50px;
  background: #ffffff20;
}

.confirm-header {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-bottom: 20px;
}

.confirm-icon {
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  border-radius: 16px;
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
}

.confirm-icon span {
  font-size: 25px;
}

.confirm-info {
  min-width: 0;
}

.confirm-title {
  font-size: 1rem;
  font-weight: 750;
  margin-bottom: 4px;
}

.confirm-file {
  color: var(--text-muted);
  font-size: 0.72rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.destination-title {
  color: var(--text-secondary);
  font-size: 0.69rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  margin-bottom: 10px;
}

.destination-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.destination {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 17px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 11px;
  text-align: left;
  color: var(--text);
  cursor: pointer;
  transition: 0.18s ease;
}

.destination:hover {
  background: var(--surface-hover);
  border-color: var(--accent-border);
}

.destination:active {
  transform: scale(0.985);
}

.destination:disabled {
  opacity: 0.55;
  pointer-events: none;
}

.destination-icon {
  width: 39px;
  height: 39px;
  flex: 0 0 39px;
  border-radius: 12px;
  background: #ffffff08;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
}

.destination-icon span {
  font-size: 20px;
}

.destination-info {
  flex: 1;
  min-width: 0;
}

.destination-name {
  font-size: 0.77rem;
  font-weight: 650;
  margin-bottom: 3px;
  line-height: 1.25;
}

.destination-path {
  color: var(--text-muted);
  font-size: 0.61rem;
  line-height: 1.35;
  word-break: break-all;
}

.destination-arrow {
  color: var(--text-muted);
  font-size: 20px;
}

.cancel-button {
  width: 100%;
  height: 44px;
  margin-top: 11px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.79rem;
  font-weight: 650;
  cursor: pointer;
}

.cancel-button:active {
  background: var(--surface-hover);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 27px;
  z-index: 300;
  max-width: calc(100% - 32px);
  padding: 12px 17px;
  border-radius: 15px;
  background: #232637e6;
  border: 1px solid var(--border-strong);
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 0.76rem;
  font-weight: 600;
  box-shadow: 0 12px 35px #00000055;
  transform: translate(-50%, 80px);
  opacity: 0;
  pointer-events: none;
  transition: 0.25s ease;
}

.toast.show {
  transform: translate(-50%, 0);
  opacity: 1;
}

.toast.success {
  border-color: #45d98a45;
}

.toast.success #toastIcon {
  color: var(--success);
}

.toast.error {
  border-color: #ff5d7345;
}

.toast.error #toastIcon {
  color: var(--danger);
}

<body>

<div class="container">

  <div class="hero">

    <div class="key-icon">
      <span class="material-icons-round">vpn_key</span>
    </div>

    <div class="hero-text">

  <div class="files-panel">

    <div class="files-header">

      <button class="refresh" id="refreshBtn" aria-label="Refresh">

      <div class="scanning">

  </div>

</div>

<div class="overlay" id="confirmOverlay">

  <div class="confirm-card">

    <div class="drag-handle"></div>

    <div class="confirm-header">

      <div class="confirm-icon">
        <span class="material-icons-round">vpn_key</span>
      </div>

      <div class="confirm-info">
        <div class="confirm-title">Set Keybox</div>
        <div class="confirm-file" id="selectedFileName"></div>
      </div>

    </div>

    <div class="destination-title">
      Choose destination
    </div>

    <div class="destination-list">

      <button class="destination" data-destination="omk" type="button">

        <div class="destination-icon">
          <span class="material-icons-round">key</span>
        </div>

        <div class="destination-info">
          <div class="destination-name">OH MY KEYMINT</div>
          <div class="destination-path">/data/misc/keystore/omk/keybox.xml</div>
        </div>

        <span class="material-icons-round destination-arrow">chevron_right</span>

      </button>

      <button class="destination" data-destination="tricky" type="button">

        <div class="destination-icon">
          <span class="material-icons-round">security</span>
        </div>

        <div class="destination-info">
          <div class="destination-name">TRICKY STORE / OOS / TEE SIMULATOR RS</div>
          <div class="destination-path">/data/adb/tricky_store/keybox.xml</div>
        </div>

        <span class="material-icons-round destination-arrow">chevron_right</span>

      </button>

      <button class="destination" data-destination="teesim" type="button">

        <div class="destination-icon">
          <span class="material-icons-round">memory</span>
        </div>

        <div class="destination-info">
          <div class="destination-name">TEE SIMULATOR</div>
          <div class="destination-path">/data/adb/teesim/keybox.xml</div>
        </div>

        <span class="material-icons-round destination-arrow">chevron_right</span>

      </button>

    </button>

  </div>

</div>

<div class="toast" id="toast">
  <span class="material-icons-round" id="toastIcon">check_circle</span>
  <span id="toastText">Success</span>
</div>

<script>
const DOWNLOAD_DIR = "/sdcard/Download";
const BACKUP_DIR = "/data/adb/Box-Brain/KeyBackup";

const DESTINATIONS = {
  omk: {
    name: "OH MY KEYMINT",
    path: "/data/misc/keystore/omk/keybox.xml"
  },

  tricky: {
    name: "TRICKY STORE / OOS / TEE SIMULATOR RS",
    path: "/data/adb/tricky_store/keybox.xml"
  },

  teesim: {
    name: "TEE SIMULATOR",
    path: "/data/adb/teesim/keybox.xml"
  }
};

let allFiles = [];
let selectedFile = null;
let isScanning = false;
let isSetting = false;
let toastTimer = null;

function runShell(cmd) {
  return new Promise((resolve, reject) => {

    if (window.parent && window.parent.runShellFromIframe) {
      window.parent.runShellFromIframe(cmd)
        .then(resolve)
        .catch(reject);

      return;
    }

    if (window.runShell && window.runShell !== runShell) {
      try {
        const result = window.runShell(cmd);

        if (result && typeof result.then === "function") {
          result.then(resolve).catch(reject);
        } else {
          resolve(result);
        }

        return;
      } catch (error) {
        reject(error);
        return;
      }
    }

    reject("Shell unavailable");
  });
}

function shellQuote(value) {
  return "'" + String(value).replace(/'/g, "'\\''") + "'";
}

function showToast(message, type) {
  const toast = document.getElementById("toast");
  const icon = document.getElementById("toastIcon");
  const text = document.getElementById("toastText");

  clearTimeout(toastTimer);

  icon.textContent =
    type === "success"
      ? "check_circle"
      : "error";

  text.textContent = message;

  toast.className = "toast show " + type;

  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2800);
}

function formatSize(bytes) {
  const size = Number(bytes) || 0;

  if (size < 1024) {
    return size + " B";
  }

  if (size < 1024 * 1024) {
    return (size / 1024).toFixed(1) + " KB";
  }

  return (size / (1024 * 1024)).toFixed(1) + " MB";
}

function formatDate(timestamp) {
  const value = Number(timestamp);

  if (!value) {
    return "Unknown date";
  }

  return new Date(value * 1000).toLocaleString();
}

function relativePath(path) {
  if (path.indexOf(DOWNLOAD_DIR + "/") === 0) {
    return path.substring((DOWNLOAD_DIR + "/").length);
  }

  return path;
}

async function scan() {
  if (isScanning) {
    return;
  }

  isScanning = true;

  const refresh = document.getElementById("refreshBtn");
  const list = document.getElementById("fileList");
  const count = document.getElementById("fileCount");

  refresh.classList.add("spinning");
  count.textContent = "Scanning...";

  list.innerHTML = `
    <div class="scanning">
      <div class="spinner"></div>
      <span>Scanning Download...</span>
    </div>
  `;

  try {

    const command =
      "find " +
      shellQuote(DOWNLOAD_DIR) +
      " -type f -iname '*.xml' -printf '%T@|%s|%p\\n' 2>/dev/null | sort -nr";

    const output = await runShell(command);

    parseFiles(output);

  } catch (error) {

    console.error("Scan failed:", error);

    allFiles = [];

    count.textContent = "Scan failed";

    list.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          <span class="material-icons-round">error_outline</span>
        </div>

        <div class="empty-title">Unable to scan Download</div>

        <div class="empty-text">
          Shell access is unavailable.
        </div>

      </div>
    `;

  } finally {

    refresh.classList.remove("spinning");
    isScanning = false;
  }
}

function parseFiles(output) {
  if (!output || !output.trim()) {
    allFiles = [];
    document.getElementById("fileCount").textContent = "No XML files found";
    renderEmpty();
    return;
  }

  allFiles = output
    .trim()
    .split("\n")
    .filter(Boolean)
    .map(line => {

      const firstSeparator = line.indexOf("|");
      const secondSeparator = line.indexOf("|", firstSeparator + 1);

      if (firstSeparator === -1 || secondSeparator === -1) {
        return null;
      }

      const timestamp = parseFloat(
        line.substring(0, firstSeparator)
      ) || 0;

      const size = parseInt(
        line.substring(firstSeparator + 1, secondSeparator),
        10
      ) || 0;

      const path = line.substring(secondSeparator + 1);

      return {
        timestamp,
        size,
        path,
        name: path.split("/").pop()
      };

    })
    .filter(file => file && file.path && /\.xml$/i.test(file.name));

  document.getElementById("fileCount").textContent =
    allFiles.length === 1
      ? "1 XML file found"
      : allFiles.length + " XML files found";

  render();
}

function render() {
  const list = document.getElementById("fileList");

  if (!allFiles.length) {
    renderEmpty();
    return;
  }

  list.innerHTML = allFiles.map((file, index) => {

    return `
      <div class="file-item" style="flex-wrap:wrap">

        <div class="file-icon">
          <span class="material-icons-round">description</span>
        </div>

        <div class="file-info">

          <div class="file-name">
            ${escapeHtml(file.name)}
          </div>

          <div class="file-path">
            ${escapeHtml(relativePath(file.path))}
          </div>

          <div class="file-meta">
            ${formatSize(file.size)}
          </div>

        </div>

        <div class="file-actions">
          <button class="preview-button" data-preview-index="${index}" type="button">Preview</button>
          <button class="set-button" data-index="${index}" type="button">Set</button>
        </div>
        <div class="keybox-details" id="keybox-details-${index}"><span class="details-empty">Reading keybox details…</span></div>

      </div>
    `;

  }).join("");

  allFiles.forEach((file, index) => loadKeyboxDetails(file, index));

  list.querySelectorAll(".preview-button").forEach(button => {
    button.addEventListener("click", event => {
      event.stopPropagation();
      const index = Number(button.dataset.previewIndex);
      if (Number.isInteger(index) && allFiles[index]) previewFile(allFiles[index]);
    });
  });

  list.querySelectorAll(".set-button").forEach(button => {

    button.addEventListener("click", event => {

      event.stopPropagation();

      const index = Number(button.dataset.index);

      if (!Number.isInteger(index) || !allFiles[index]) {
        return;
      }

      openConfirmation(allFiles[index]);
    });

  });
}

function extractKeyboxDetails(xml) {
  const source = String(xml || "");
  const results = [];
  const add = (label, value) => { if (value !== null && String(value).trim()) results.push({label, value: String(value).trim()}); };
  const deviceRe = /<\s*(?:[\w.-]+:)?Keybox\b([^>]*)>/gi;
  let m;
  while ((m = deviceRe.exec(source))) {
    const attr = m[1].match(/\bDeviceID\s*=\s*(["'])(.*?)\1/i);
    if (attr) add("DeviceID", attr[2]);
  }
  const numberRe = /<\s*(?:[\w.-]+:)?NumberOfCertificates\b[^>]*>\s*([\s\S]*?)\s*<\s*\/\s*(?:[\w.-]+:)?NumberOfCertificates\s*>/gi;
  while ((m = numberRe.exec(source))) add("NumberOfCertificates", m[1].replace(/<[^>]*>/g, "").trim());
  const certRe = /<\s*(?:[\w.-]+:)?Certificate\b([^>]*)>/gi;
  while ((m = certRe.exec(source))) {
    const attr = m[1].match(/\bformat\s*=\s*(["'])(.*?)\1/i);
    if (attr) add("Certificate format", attr[2]);
  }
  const keyRe = /<\s*(?:[\w.-]+:)?Key\b([^>]*)>/gi;
  while ((m = keyRe.exec(source))) {
    const attr = m[1].match(/\balgorithm\s*=\s*(["'])(.*?)\1/i);
    if (attr) add("Key algorithm", attr[2]);
  }
  const seen = new Set();
  return results.filter(item => {
    const key = item.label + "\u0000" + item.value;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

async function loadKeyboxDetails(file, index) {
  const target = document.getElementById("keybox-details-" + index);
  if (!target) return;
  try {
    const xml = await runShell("cat -- " + shellQuote(file.path));
    const details = extractKeyboxDetails(xml);
    if (!details.length) {
      target.innerHTML = '<span class="details-empty">No matching keybox metadata found</span>';
      return;
    }
    target.innerHTML = details.map(item => '<span class="detail-row"><span class="detail-label">' + escapeHtml(item.label) + ': </span><span class="detail-value">' + escapeHtml(item.value) + '</span></span>').join("");
  } catch (e) {
    target.innerHTML = '<span class="details-empty">Unable to read keybox details</span>';
  }
}

function renderEmpty() {
  document.getElementById("fileList").innerHTML = `
    <div class="empty">

      <div class="empty-icon">
        <span class="material-icons-round">folder_open</span>
      </div>

      <div class="empty-title">
        No XML files found
      </div>

      <div class="empty-text">
        Place a keybox XML anywhere inside<br>
        ${DOWNLOAD_DIR}
      </div>

    </div>
  `;
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function previewFile(file) {
  const overlay = document.getElementById("previewOverlay");
  const content = document.getElementById("previewContent");
  document.getElementById("previewFileName").textContent = file.path;
  content.textContent = "Loading XML…";
  overlay.classList.add("show");
  try {
    const output = await runShell("cat -- " + shellQuote(file.path));
    content.textContent = String(output == null ? "" : output) || "(Empty file)";
  } catch (error) {
    content.textContent = "Unable to read this file.";
  }
}

function closePreview() {
  document.getElementById("previewOverlay").classList.remove("show");
}

function openConfirmation(file) {
  selectedFile = file;

  document.getElementById("selectedFileName").textContent =
    file.name;

  document.getElementById("confirmOverlay").classList.add("show");
}

function closeConfirmation() {
  if (isSetting) {
    return;
  }

  document.getElementById("confirmOverlay").classList.remove("show");

  setTimeout(() => {
    selectedFile = null;
  }, 220);
}

async function setKeybox(destinationKey) {
  if (!selectedFile || isSetting) {
    return;
  }

  const destination = DESTINATIONS[destinationKey];

  if (!destination) {
    return;
  }

  isSetting = true;

  const buttons = document.querySelectorAll(".destination");

  buttons.forEach(button => {
    button.disabled = true;
  });

  const source = selectedFile.path;
  const target = destination.path;

  try {

    const sourceQuoted = shellQuote(source);
    const targetQuoted = shellQuote(target);
    const backupDirQuoted = shellQuote(BACKUP_DIR);

    const command = `
      set -e

      src=${sourceQuoted}
      target=${targetQuoted}
      backup=${backupDirQuoted}

      [ -f "$src" ]

      mkdir -p "$backup"

      if [ -f "$target" ]; then
        timestamp=$(date '+%Y%m%d-%H%M%S')
        backup_file="$backup/key-loader-$timestamp.XML"
        counter=1

        while [ -e "$backup_file" ]; do
          backup_file="$backup/key-loader-$timestamp-$counter.XML"
          counter=$((counter + 1))
        done

        cp -f "$target" "$backup_file"
        chmod 644 "$backup_file"
      fi

      mkdir -p "$(dirname "$target")"

      cp -f "$src" "$target"
      chmod 644 "$target"
    `;

    await runShell(
      "sh -c " + shellQuote(command)
    );

    closeConfirmation();

    showToast(
      "Keybox set to " + destination.name,
      "success"
    );

  } catch (error) {

    console.error("Set keybox failed:", error);

    showToast(
      "Failed to set keybox",
      "error"
    );

  } finally {

    isSetting = false;

    buttons.forEach(button => {
      button.disabled = false;
    });

  }
}

document.getElementById("closePreview").addEventListener("click", closePreview);
document.getElementById("previewOverlay").addEventListener("click", event => {
  if (event.target.id === "previewOverlay") closePreview();
});

document.getElementById("refreshBtn").addEventListener(
  "click",
  scan
);

document.getElementById("cancelButton").addEventListener(
  "click",
  closeConfirmation
);

document.getElementById("confirmOverlay").addEventListener(
  "click",
  event => {

    if (event.target.id === "confirmOverlay") {
      closeConfirmation();
    }

  }
);

document.querySelectorAll(".destination").forEach(button => {

  button.addEventListener("click", () => {

    const destination = button.dataset.destination;

    setKeybox(destination);
  });

});

document.addEventListener("keydown", event => {

  if (event.key === "Escape") {
    closeConfirmation();
    closePreview();
  }

});

scan();
</script>
